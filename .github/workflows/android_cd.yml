name: Android CD - Release

on:
  push:
    tags:
      - 'v*' # Trigger deployment when a tag like v1.0.0 is pushed
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  release:
    name: Build, Sign and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Google Services JSON
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon -PFIREBASE_ENABLED=true -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=1.0.${{ github.run_number }}

      - name: Sign Android Release
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pokedex-release-aab
          path: ${{steps.sign_app.outputs.signedReleaseFile}}

      # Uncomment the following step to enable automatic Play Store deployment
      # Requires a Google Play Console API Service Account JSON stored in GitHub Secrets
      # - name: Deploy to Google Play (Internal Track)
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.example.pokedex
      #     releaseFiles: ${{steps.sign_app.outputs.signedReleaseFile}}
      #     track: internal
