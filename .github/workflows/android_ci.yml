name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create dummy google-services.json
        run: |
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "dummy-project"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.example.pokedex"
                  }
                },
                "api_key": [{"current_key": "dummy"}],
                "oauth_client": [
                  {
                    "client_id": "dummy-web-client-id.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Ktlint Check
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run Detekt
        run: ./gradlew detekt --no-daemon

      - name: Verify architecture contracts
        run: >
          ./gradlew
          verifyModuleBoundaries
          :features:favorite:api:verifyApiContract
          --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Roborazzi Screenshot Tests
        run: ./gradlew verifyRoborazziDebug --no-daemon

      - name: Compile Instrumented and Preview Screenshot Tests
        run: >
          ./gradlew
          :core:data:compileDebugAndroidTestKotlin
          :app:compileDebugAndroidTestKotlin
          :features:pokemon_list:compileDebugAndroidTestKotlin
          :features:pokemon_list:compileDebugScreenshotTestKotlin
          --no-daemon

      - name: Build Macrobenchmark APKs
        run: >
          ./gradlew
          :macrobenchmark:assembleBenchmarkBenchmark
          :macrobenchmark:assembleBenchmarkRelease
          --no-daemon

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Generate CycloneDX SBOM
        run: ./gradlew :app:cyclonedxDirectBom --no-daemon

      - name: Run demo end-to-end journey
        run: >
          ./gradlew
          :core:data:pixel2Api35DebugAndroidTest
          :app:pixel2Api35DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pokedex-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pokedex-cyclonedx-sbom
          path: app/build/reports/cyclonedx-direct/

  preview-screenshots:
    name: Preview Screenshot Tests
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create dummy google-services.json
        run: |
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "dummy-project"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.example.pokedex"
                  }
                },
                "api_key": [{"current_key": "dummy"}],
                "oauth_client": [
                  {
                    "client_id": "dummy-web-client-id.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Run Preview Screenshot Tests
        run: ./gradlew :features:pokemon_list:validateDebugScreenshotTest --no-daemon

      - name: Upload Preview Screenshot report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-screenshot-report
          path: features/pokemon_list/build/reports/screenshotTest/preview/debug/
